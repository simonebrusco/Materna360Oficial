name: PR · ADM Frase Simples (anti-repetição)

on:
  pull_request:
    paths:
      - "app/api/ai/meu-dia-leve/frase-simples/**"
      - "scripts/check-frase-simples.sh"
      - ".github/workflows/pr-adm-frase-simples.yml"

jobs:
  validate-frase-simples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Start Next.js (background)
        run: |
          PORT=3011 pnpm dev > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid

      - name: Wait for health (/api/ping)
        env:
          BASE_URL: http://127.0.0.1:3011
        run: |
          for i in $(seq 1 60); do
            code="$(curl -sS -o /dev/null -w "%{http_code}" "$BASE_URL/api/ping" || true)"
            if [ "$code" = "200" ]; then
              echo "OK: /api/ping ready"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: /api/ping not ready"
          echo "---- next-dev.log ----"
          tail -n 200 /tmp/next-dev.log || true
          exit 1

      - name: Run ADM validation (frase-simples)
        env:
          BASE_URL: http://127.0.0.1:3011
        run: |
          bash scripts/check-frase-simples.sh

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next-dev.pid ]; then
            kill "$(cat /tmp/next-dev.pid)" || true
          fi
